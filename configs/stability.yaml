# Curvas de estabilidade — seção 2.2.7
# run_all.py ajusta sample_sizes automaticamente ao pool de ajuste
# (potências de 2 até o pool, mais o pool inteiro se o último ponto ficar
# >25% abaixo). Para controlar à mão: run_all.py --no-auto-sizes.
# configs\stability.yaml
sample_sizes: [8, 16, 32, 64, 128]
n_repetitions: 5
seed: 42

metrics:
  top_k: 20
  bootstrap_samples: 500
  bootstrap_seed: 42
