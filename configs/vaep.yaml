# VAEP — Decroos et al. (2019), seção 2.2.5
gamestate:
  nb_prev_actions: 3
  horizon: 10

# [AJUSTAR] O paper não reporta hiperparâmetros exatos. Se fizer busca,
# registrar na seção 2.2.5.
xgboost:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  n_jobs: -1
  random_state: 42
  verbosity: 0
